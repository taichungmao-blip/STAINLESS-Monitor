name: Nickel & Stainless Steel Strategy Tracker

on:
  schedule:
    # 每天 UTC 時間 21:25 (台灣時間隔天早上 05:25，剛好涵蓋美股/LME 收盤)
    - cron: '25 21 * * 1-5' 
  workflow_dispatch: # 允許手動執行測試

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip' # 加入快取功能，加快後續執行速度

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 這裡移除手動 pip install，改為統一使用 requirements.txt
        pip install -r requirements.txt

    - name: Run Strategy Script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # 確保環境變數正確傳遞
        MPLBACKEND: Agg 
      run: |
        # 增加一個 debug 指令，確認圖片是否有生成
        python main.py
